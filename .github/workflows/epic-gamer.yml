name: Epic Awesome Gamer (Scheduled)

on:
  workflow_dispatch: # 手动触发
  schedule:
    # 每天一次（北京时间 00:30，位于 Epic 周四 15:00 UTC 刷新之后）。
    #
    # 为什么不是"每周四/五/六/日各一次"：GitHub 的 schedule 会静默丢触发——本仓库
    # 2026-10-14 起连续 8 天 0 触发，而 workflow 仍是 active。每天一次 + 运行前先做
    # 一次"只读真值预检"（已领完就 20 秒退出、不启浏览器、不出验证码），等价于把
    # 每周 1 次机会变成每周 7 次，且成本不变。详见 docs/direction-2026-10-v3.md §5。
    - cron: '30 16 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  epic-gamer:
    runs-on: ubuntu-latest
    # A single account run can take 15-20 minutes. Multi-account runs are
    # sequential, so scale the timeout with the number of accounts by setting
    # a repository variable JOB_TIMEOUT_MINUTES (Settings -> Secrets and
    # variables -> Actions -> Variables). Defaults to 60 minutes.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT_MINUTES || '60') }}
    permissions:
      contents: write

    # 默认不在主仓库自身执行定时任务；Fork 后的仓库会正常运行。
    if: github.repository != 'Ronchy2000/epic-freebies-helper'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 复用上次运行保存的浏览器配置文件（含 Epic 登录会话）：
      # 会话仍有效时 invoke() 直接跳过登录，从根源上避开登录 hCaptcha 这一主要失败点。
      #
      # 缓存分两级，避免"失败覆盖成功"的雪崩：
      #   epic-session-ok-*   → 只有领取确认成功（workflow success）才写入
      #   epic-session-last-* → 失败运行写入，仅在没有任何 ok 缓存时兜底
      #   epic-session-*      → 旧格式，保留兼容
      # restore-keys 按顺序前缀匹配：优先最近一次成功会话，其次失败兜底，最后旧格式。
      # key 含 run_id 保证每次运行都会另存新档，不会覆盖历史成功档。
      - name: Restore Epic browser session
        uses: actions/cache/restore@v4
        with:
          path: |
            app/volumes/user_data
            app/volumes/runtime/session-state.json
          key: epic-session-ok-${{ github.run_id }}
          restore-keys: |
            epic-session-ok-
            epic-session-last-
            epic-session-

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 xvfb libxml2-dev libxslt-dev

      - name: Install dependencies
        run: uv sync

      - name: Validate hCaptcha protocol contract
        env:
          PYTHONPATH: app
        run: uv run python scripts/check_hcaptcha_contract.py

      # 增加 GITHUB_TOKEN 以降低 Camoufox 下载时的 403 频率限制。
      # 即使这里失败，运行时也可以回退到 Playwright Firefox。
      - name: Install Camoufox
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run camoufox fetch

      - name: Install Playwright Firefox fallback
        run: uv run playwright install firefox

      - name: Probe LLM gateway reachability
        continue-on-error: true
        env:
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || secrets.GLM_BASE_URL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY_V2 || secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          base = (os.environ.get("GLM_BASE_URL") or "").rstrip("/")
          key = os.environ.get("GLM_API_KEY") or ""
          model = os.environ.get("GLM_MODEL") or ""
          print(f"gateway base set: {bool(base)} model={model}")
          if not base or not key:
              print("gateway probe skipped: missing base or key")
              raise SystemExit(0)
          for path in ("models", "chat/completions"):
              url = f"{base}/{path}"
              try:
                  if path == "models":
                      req = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          ids = [m.get("id") for m in json.load(r).get("data", [])]
                      print(f"GET {path}: HTTP200 models={len(ids)} has_target={model in ids}")
                  else:
                      payload = {"model": model, "messages": [{"role": "user", "content": "Return ONLY {\"ok\":true}"}], "temperature": 0, "response_format": {"type": "json_object"}}
                      req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          print(f"POST {path}: HTTP{r.status} " + r.read().decode()[:200])
              except Exception as e:
                  body = ""
                  try:
                      body = e.read().decode()[:300]
                  except Exception:
                      pass
                  print(f"{path} FAILED: {e!r} {body}")
          EOF

      - name: Run Epic Awesome Gamer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_ACCOUNTS: ${{ secrets.EPIC_ACCOUNTS }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          # 云端的会话令牌：首次运行由浏览器登录自动铸造并回存，之后每次纯 HTTP 续期，
          # 因此正常情况下不会再出现登录页（也就不会出验证码）。
          EPIC_REFRESH_TOKEN: ${{ secrets.EPIC_REFRESH_TOKEN }}
          SESSION_STATE_ENABLED: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY_V2 || secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
          GLM_REQUEST_TIMEOUT_SECONDS: ${{ vars.GLM_REQUEST_TIMEOUT_SECONDS || secrets.GLM_REQUEST_TIMEOUT_SECONDS || '110' }}
          CHALLENGE_CLASSIFIER_MODEL: ${{ vars.CHALLENGE_CLASSIFIER_MODEL || secrets.CHALLENGE_CLASSIFIER_MODEL }}
          IMAGE_CLASSIFIER_MODEL: ${{ vars.IMAGE_CLASSIFIER_MODEL || secrets.IMAGE_CLASSIFIER_MODEL }}
          SPATIAL_POINT_REASONER_MODEL: ${{ vars.SPATIAL_POINT_REASONER_MODEL || secrets.SPATIAL_POINT_REASONER_MODEL }}
          SPATIAL_PATH_REASONER_MODEL: ${{ vars.SPATIAL_PATH_REASONER_MODEL || secrets.SPATIAL_PATH_REASONER_MODEL }}
          BROWSER_BACKEND: auto
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          HEADLESS: virtual
          DISABLE_BEZIER_TRAJECTORY: false
          # 在 Actions 中我们依靠 GitHub 的 cron 触发，所以关闭内部调度器
          ENABLE_APSCHEDULER: false
          AUTH_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.AUTH_ATTEMPT_TIMEOUT_SECONDS || '240' }}
          # 每次运行只试 1 次：同账号连续重试会把 Epic 的风险分推高（2026-10-21 实测：
          # 几小时内 15 次尝试，把「12 次里成 2 次」压到「10 次全灭」）。重试交给"每天一次"
          # 的调度，而不是压在同一轮里。详见 docs/direction-2026-10-v3.md。
          AUTH_MAX_ATTEMPTS: ${{ vars.AUTH_MAX_ATTEMPTS || '1' }}
          MPLBACKEND: Agg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: app
        run: |
          echo "🚀 启动定时领取任务（支持 Gemini/AiHubMix/GLM）..."
          xvfb-run --auto-servernum --server-num=1 --server-args='-screen 0, 1920x1080x24' uv run app/deploy.py

      # 成功运行才更新"可信会话档"：这份档案里的 profile 一定包含可用的 Epic 会话，
      # 下次 restore 优先命中它，从而跳过登录 hCaptcha。
      - name: Save Epic browser session (verified)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            app/volumes/user_data
            app/volumes/runtime/session-state.json
          key: epic-session-ok-${{ github.run_id }}

      # 失败运行只写"兜底档"，绝不覆盖可信档；没有可信档时它等价于冷启动。
      - name: Save Epic browser session (fallback)
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            app/volumes/user_data
            app/volumes/runtime/session-state.json
          key: epic-session-last-${{ github.run_id }}

      - name: Write success summary
        if: success()
        run: |
          OUTCOME_FILE=app/volumes/runtime/run-outcome.json
          OUTCOME=""
          if [ -f "$OUTCOME_FILE" ]; then
            OUTCOME=$(sed -n 's/.*"outcome"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$OUTCOME_FILE" | head -n1)
          fi
          if [ "$OUTCOME" = "all_already_owned" ]; then
            {
              echo "## Run completed: nothing to claim"
              echo
              echo "本周免费游戏此前已全部入库，本次运行未发现新的可领取项目。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Run completed"
              echo
              echo "The workflow completed successfully."
              echo
              echo "- Share successful runs here: [Share your successful runs here / 成功领取的来这里留言！ #3](https://github.com/Ronchy2000/epic-freebies-helper/discussions/3)"
              echo "- If the game was already in your library, Epic may not send a separate confirmation email. Review the logs and artifacts when verification is needed."
              echo "- If you later report an issue from a private fork, upload the artifact zip files because maintainers cannot access private Actions pages."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write failure summary
        if: failure()
        run: |
          OUTCOME_FILE=app/volumes/runtime/run-outcome.json
          OUTCOME=""
          if [ -f "$OUTCOME_FILE" ]; then
            OUTCOME=$(sed -n 's/.*"outcome"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$OUTCOME_FILE" | head -n1)
          fi
          case "$OUTCOME" in
            rate_limited)
              {
                echo "## Claim not completed: Epic 24-hour limit"
                echo
                echo "本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
                echo
                echo "Epic blocked additional free-game redemptions for the affected account. This run did not confirm a successful claim for that account."
                echo
                echo "Wait at least 24 hours before running the workflow again. Repeated retries during this period will not complete the claim."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            auth_failed_captcha|auth_failed_2fa)
              {
                echo "## Claim not completed: login failed"
                echo
                if [ "$OUTCOME" = "auth_failed_2fa" ]; then
                  echo "登录失败：Epic 账号仍启用了两步验证。请配置 EPIC_TOTP_SECRET（验证器 App 类 2FA）或关闭 2FA 后重跑。"
                else
                  echo "登录失败：hCaptcha 连续求解未通过。周五/周六/周日的定时补跑会自动重试；若连续多天失败，请在周二关注 Keepalive 工作流的会话健康结论。"
                fi
                echo
                echo "Login did not complete. Later scheduled catch-up runs will retry automatically; review the runtime/log artifacts for challenge details."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            browser_crashed_exhausted)
              {
                echo "## Claim not completed: browser crashed"
                echo
                echo "浏览器后端在运行中崩溃，自动重启后仍未恢复。该故障与 Epic 页面改版无关，通常由 Playwright/Camoufox 偶发缺陷触发。"
                echo
                echo "The browser backend died mid-run and the in-run restart also failed. Later scheduled runs will start fresh; attach the runtime artifacts when reporting."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            manual_action_required)
              {
                echo "## Claim not completed: manual action required"
                echo
                echo "Epic 要求人工确认（隐私政策或 MFA 设置提示）。请用普通浏览器手动登录一次完成对应页面，然后重跑工作流。"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              if grep -Rqs -E \
                'unable to download any more free games|wait 24 hours before trying again|free-game redemption rate limit detected' \
                app/volumes/logs/ app/volumes/runtime/ 2>/dev/null; then
                {
                  echo "## Claim not completed: Epic 24-hour limit"
                  echo
                  echo "本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
                  echo
                  echo "Wait at least 24 hours before running the workflow again. Repeated retries during this period will not complete the claim."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                {
                  echo "## Claim not completed"
                  echo
                  echo "本次领取未完成，不能视为领取成功。"
                  echo
                  echo "The workflow failed before all available games were confirmed in the library. Do not treat this run as a successful claim."
                  echo
                  echo "Review the failed step and uploaded runtime/log artifacts for the specific cause."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac

      # 每周一行账：既是最省事的"这周到底领到没有"的证据，也是仓库保活（GitHub 会停用
      # 长期无提交仓库的 schedule）。写失败不影响本次领取结论。
      - name: Append scoreboard record
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: app
        run: |
          uv run python scripts/scoreboard.py
          OUTCOME=""
          if [ -f app/volumes/runtime/run-outcome.json ]; then
            OUTCOME=$(sed -n 's/.*"outcome"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' app/volumes/runtime/run-outcome.json | head -n1)
          fi
          # 只在"真的领到了"或每周一提交一次，避免每天一条噪音提交；已足够让仓库保持活跃。
          if [ "$OUTCOME" != "claimed_ok" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "scoreboard: commit skipped (outcome=${OUTCOME:-none}, weekday=$(date -u +%u))"
            exit 0
          fi
          git config user.name "epic-freebies-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scoreboard.json
          if git diff --cached --quiet; then
            echo "scoreboard: no change to commit"
            exit 0
          fi
          git commit -m "chore: record run $(date -u +%F) [skip ci]"
          git push

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-runtime-${{ github.run_id }}
          path: |
            app/volumes/runtime/
            app/volumes/hcaptcha/.challenge/
          include-hidden-files: true
          retention-days: 7

      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-logs-${{ github.run_id }}
          path: app/volumes/logs/
          retention-days: 7

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-screenshots-${{ github.run_id }}
          path: app/volumes/screenshots/
          retention-days: 7
