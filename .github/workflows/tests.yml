name: Tests

# 回归门禁：纯逻辑测试（崩溃分类、重启自愈、档案健康守卫）。
# 不启动真实浏览器，不需要 xvfb / camoufox 二进制。

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          # hcaptcha-challenger 的 AgentConfig 在 settings 实例化时强校验 LLM key；
          # 纯逻辑测试不会发起任何模型请求，占位值即可满足构造。
          GEMINI_API_KEY: dummy-key-for-tests
        run: uv run pytest -q
